##############################################
# Nombre de la aplicación
##############################################
spring.application.name=iw3

##############################################
# Configuración de la base de datos MySQL
##############################################
spring.datasource.url=jdbc:mysql://localhost:3306/iw3_2025?createDatabaseIfNotExist=true&verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=iw3
spring.datasource.password=iw3pass
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

##############################################
# Configuración de JPA y Hibernate
##############################################
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear SQL generado por Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Estadísticas y propiedades adicionales de Hibernate
spring.jpa.properties.hibernate.generate_statistics=false

##############################################
# Configuración de HikariCP (Pool de conexiones)
##############################################
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false

##############################################
# Configuración de logging
##############################################
# Niveles generales
logging.level.root=WARN

# Logging específico de Spring y Hibernate
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.type=WARN

# Logging de HikariCP
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=INFO

# Logging de la aplicación principal
logging.level.ar.edu.iua.iw3.BackendApplication=DEBUG